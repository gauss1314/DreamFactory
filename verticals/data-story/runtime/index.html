<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>data-story</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="paper" class="fx" width="1920" height="1080" aria-hidden="true">
        <filter id="tooth" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85 0.6" numOctaves="3" seed="7" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="1920" height="1080" filter="url(#tooth)" />
      </svg>
      <div id="scenes"></div>
      <div id="vignette" class="fx"></div>
      <div id="subtitle" data-df-role="subtitle" data-df-box></div>
      <div id="source" data-df-role="source"></div>
      <div id="progress"></div>
      <div id="grain" class="fx"></div>
    </div>
    <script type="module" src="df.js"></script>
  </body>
</html>
